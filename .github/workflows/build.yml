name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-26 builds with the Xcode 26 SDK, which has the Liquid Glass APIs;
    # its bundle is the one to download. macos-14's older toolchain compiles
    # only the pre-macOS 26 fallback, which keeps that path building too.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            suffix: ""
          - runner: macos-14
            suffix: "-macos14"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          swift --version

      - name: Build (debug)
        run: swift build -v

      - name: Build (release)
        run: swift build -c release -v

      - name: Unit tests
        run: swift test

      - name: Package .app bundle
        run: |
          chmod +x scripts/build-app.sh
          scripts/build-app.sh release

      # Runs the packaged app against the real nettop/lsof while curl makes
      # traffic, then checks the app counted it and dropped curl's rate and
      # hosts once curl exited. perl's alarm is the watchdog (macOS has no
      # `timeout`), so an app that never reports fails instead of hanging.
      - name: Smoke test the app
        run: |
          NETPULSE_SELFTEST_SECONDS=30 NETPULSE_SELFTEST_SNAPSHOTS="$PWD/selftest-snapshots" \
            perl -e 'alarm 90; exec @ARGV' \
            dist/NetPulse.app/Contents/MacOS/NetPulse > selftest.json &
          APP=$!
          # The same nettop invocation the app uses, logged raw, so a failed
          # check shows what nettop actually printed for curl.
          perl -e 'alarm 40; exec @ARGV' script -q /dev/null nettop -P -x -l 0 -s 1 -J bytes_in,bytes_out > nettop.log 2>&1 &
          sleep 5
          curl -sSL --limit-rate 300k --max-time 10 -o /dev/null \
            https://download.swift.org/swift-5.10-release/xcode/swift-5.10-RELEASE/swift-5.10-RELEASE-osx.pkg || true
          wait $APP
          if ! python3 scripts/check-selftest.py selftest.json; then
            echo "--- first nettop lines ---"; head -n 8 nettop.log
            echo "--- nettop rows for curl ---"; grep -i curl nettop.log | head -n 40
            exit 1
          fi

      - name: Upload UI self-test snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-snapshots${{ matrix.suffix }}
          path: selftest-snapshots
          if-no-files-found: warn

      # upload-artifact rewrites every file to 644/755 and would take
      # dist/NetPulse.app's *contents* as the archive root, so a downloaded
      # bundle loses its executable bit and its .app wrapper. Zipping with
      # ditto first keeps permissions, the wrapper and the code signature
      # intact; the artifact is that zip (GitHub wraps it in one more zip).
      - name: Zip the bundle
        run: |
          ditto -c -k --keepParent --sequesterRsrc dist/NetPulse.app dist/NetPulse.zip

      - name: Upload NetPulse.app
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-app${{ matrix.suffix }}
          path: dist/NetPulse.zip
          if-no-files-found: error
